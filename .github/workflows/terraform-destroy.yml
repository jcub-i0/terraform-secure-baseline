name: Terraform Destroy

run-name: Terraform destroy - ${{ inputs.environment }}

on:
    workflow_dispatch:
        # checkov:skip=CKV_GHA_7:Intentional operator inputs for a protected, approval-gated destroy workflow.
        inputs:
            environment:
                description: "Environment to destroy"
                required: true
                type: choice
                options: [dev, staging, prod]
            confirm:
                description: "Type DESTROY to authorize the destroy workflow"
                required: true
                type: string
            delete_durable_retirement_data:
                description: "Authorize ECR/Backup cleanup and final logs-bucket deletion (deployment_profile=production only)"
                required: true
                default: false
                type: boolean
            confirm_audit_log_disposition:
                description: "Confirm reviewed audit-log/key retention or approved disposal (deployment_profile=production only)"
                required: true
                default: false
                type: boolean
            audit_log_disposition_reference:
                description: "Approved audit-log/key disposition record ID (deployment_profile=production only; non-secret)"
                required: false
                default: ""
                type: string

permissions: {}

concurrency:
    group: terraform-workload-${{ inputs.environment }}
    cancel-in-progress: false

env:
    AWS_PAGER: ""
    TF_IN_AUTOMATION: "true"
    TF_INPUT: "false"
    TERRAFORM_VERSION: "1.15.8"

    DESTROY_ARTIFACT_NAME: terraform-destroy-plan-${{ inputs.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
    DESTROY_ARTIFACT_DIR: terraform-destroy-plan-artifact
    DESTROY_PLAN_BASENAME: baseline-destroy


jobs:
    terraform-destroy-preflight:
        name: Preflight ${{ inputs.environment }} destroy
        runs-on: ubuntu-latest
        timeout-minutes: 30
        environment: ${{ format('{0}-plan', inputs.environment) }}

        permissions:
            contents: read
            id-token: write

        outputs:
            expected_account_id: ${{ steps.context.outputs.expected_account_id }}
            primary_region: ${{ steps.context.outputs.primary_region }}
            deployment_profile: ${{ steps.context.outputs.deployment_profile }}
            production_retirement_mode: ${{ steps.context.outputs.production_retirement_mode }}

        env:
            WORKING_DIRECTORY: ./environments/${{ inputs.environment }}
            EXPECTED_ACCOUNT_ID: ${{ vars.ACCOUNT_ID }}
            AWS_REGION: ${{ vars.PRIMARY_REGION }}
            AWS_DEFAULT_REGION: ${{ vars.PRIMARY_REGION }}
            PLAN_ROLE_GITHUB_ARN: ${{ vars.PLAN_ROLE_GITHUB_ARN }}
            DELETE_DURABLE_RETIREMENT_DATA: ${{ inputs.delete_durable_retirement_data }}
            AUDIT_LOG_DISPOSITION_CONFIRMED: ${{ inputs.confirm_audit_log_disposition }}
            AUDIT_LOG_DISPOSITION_REFERENCE: ${{ inputs.audit_log_disposition_reference }}

            TF_VAR_cloud_name: ${{ vars.CLOUD_NAME }}
            TF_VAR_environment: ${{ inputs.environment }}
            TF_VAR_primary_region: ${{ vars.PRIMARY_REGION }}
            TF_VAR_abuseipdb_api_key: ${{ secrets.ABUSEIPDB_API_KEY }}
            TF_VAR_bucket_admin_principals: ${{ vars.BUCKET_ADMIN_PRINCIPALS }}
            TF_VAR_tf_state_bucket_arn: ${{ vars.TF_STATE_BUCKET_ARN }}
            TF_VAR_tf_state_bucket_cmk_arn: ${{ vars.TF_STATE_BUCKET_CMK_ARN }}
            TF_VAR_deployment_profile: ${{ vars.DEPLOYMENT_PROFILE }}
            TF_VAR_break_glass_trusted_principal_arns: ${{ vars.BREAK_GLASS_TRUSTED_PRINCIPAL_ARNS }}
            TF_VAR_secops_emails: ${{ vars.SECOPS_EMAILS }}
            TF_VAR_isolation_allowed: ${{ vars.ISOLATION_ALLOWED }}
            TF_VAR_additional_interface_endpoint_services: ${{ vars.ADDITIONAL_INTERFACE_ENDPOINT_SERVICES || '[]' }}
            TF_VAR_production_retirement_mode: ${{ vars.DEPLOYMENT_PROFILE == 'production' && 'true' || 'false' }}
            TF_VAR_waf_enabled: ${{ vars.WAF_ENABLED || 'false' }}
            TF_VAR_waf_mode: ${{ vars.WAF_MODE || 'count' }}
            WAF_RATE_LIMIT_REQUESTS: ${{ vars.WAF_RATE_LIMIT_REQUESTS }}
            TF_VAR_waf_sampled_requests_enabled: ${{ vars.WAF_SAMPLED_REQUESTS_ENABLED || 'false' }}
            ALB_CERTIFICATE_ARN: ${{ vars.ALB_CERTIFICATE_ARN }}
            ALB_INGRESS_CIDRS: ${{ vars.ALB_INGRESS_CIDRS }}
            ALB_ACCESS_LOGS_ENABLED: ${{ vars.ALB_ACCESS_LOGS_ENABLED }}
            ALB_ACCESS_LOGS_RETENTION_DAYS: ${{ vars.ALB_ACCESS_LOGS_RETENTION_DAYS }}
            RDS_INSTANCE_CLASS: ${{ vars.RDS_INSTANCE_CLASS }}
            MAIN_VPC_CIDR: ${{ vars.MAIN_VPC_CIDR }}

        steps:
            - name: Checkout
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false

            - name: Validate destroy request and workload context
              id: context
              shell: bash
              run: |
                  set -euo pipefail

                  [[ "${{ inputs.confirm }}" == "DESTROY" ]] || {
                    echo "::error::Type DESTROY exactly to authorize the destroy workflow."
                    exit 1
                  }

                  required=(
                    EXPECTED_ACCOUNT_ID
                    AWS_REGION
                    PLAN_ROLE_GITHUB_ARN
                    TF_VAR_cloud_name
                    TF_VAR_environment
                    TF_VAR_primary_region
                    TF_VAR_bucket_admin_principals
                    TF_VAR_tf_state_bucket_arn
                    TF_VAR_tf_state_bucket_cmk_arn
                    TF_VAR_deployment_profile
                    TF_VAR_isolation_allowed
                  )

                  for name in "${required[@]}"; do
                    [[ -n "${!name:-}" ]] || {
                      echo "::error::${name} is not configured."
                      exit 1
                    }
                  done

                  case "${TF_VAR_deployment_profile}" in
                    production|development|minimal) ;;
                    *)
                      echo "::error::DEPLOYMENT_PROFILE must be production, development, or minimal."
                      exit 1
                      ;;
                  esac

                  [[ "${TF_VAR_isolation_allowed}" =~ ^(true|false)$ ]] || {
                    echo "::error::ISOLATION_ALLOWED must be exactly true or false."
                    exit 1
                  }

                  [[ "${TF_VAR_production_retirement_mode}" =~ ^(true|false)$ ]] || {
                    echo "::error::production_retirement_mode must be exactly true or false."
                    exit 1
                  }

                  [[ "${DELETE_DURABLE_RETIREMENT_DATA}" =~ ^(true|false)$ ]] || {
                    echo "::error::delete_durable_retirement_data must be exactly true or false."
                    exit 1
                  }

                  if [[ "${TF_VAR_deployment_profile}" == "production" ]]; then
                    [[ "${TF_VAR_production_retirement_mode}" == "true" ]] || {
                      echo "::error::Production destruction requires production_retirement_mode=true."
                      exit 1
                    }

                    [[ "${DELETE_DURABLE_RETIREMENT_DATA}" == "true" ]] || {
                      echo "::error::Production destruction requires approval for ECR/Backup cleanup and final logs-bucket deletion."
                      echo "::error::Set delete_durable_retirement_data=true and approve the protected cleanup job."
                      exit 1
                    }

                    [[ "${AUDIT_LOG_DISPOSITION_CONFIRMED}" == "true" ]] || {
                      echo "::error::Production destruction requires confirm_audit_log_disposition=true."
                      exit 1
                    }

                    if [[ ! "${AUDIT_LOG_DISPOSITION_REFERENCE}" =~ ^[A-Za-z0-9][A-Za-z0-9._:/#-]{3,199}$ ]]; then
                      echo "::error::Production destruction requires a non-secret 4-200 character approved audit-log disposition record ID."
                      exit 1
                    fi

                    case "${AUDIT_LOG_DISPOSITION_REFERENCE,,}" in
                      todo|tbd|none|null|n/a|na|test|placeholder)
                        echo "::error::Audit-log disposition record ID must not be a placeholder."
                        exit 1
                        ;;
                    esac
                  else
                    [[ "${TF_VAR_production_retirement_mode}" == "false" ]] || {
                      echo "::error::Non-production profiles must not enable production_retirement_mode."
                      exit 1
                    }

                    [[ "${DELETE_DURABLE_RETIREMENT_DATA}" == "false" ]] || {
                      echo "::error::delete_durable_retirement_data is production-only and must remain false for non-production."
                      exit 1
                    }

                    [[ "${AUDIT_LOG_DISPOSITION_CONFIRMED}" == "false" &&
                       -z "${AUDIT_LOG_DISPOSITION_REFERENCE}" ]] || {
                      echo "::error::Audit-log disposition inputs are production-only; non-production must leave them false/empty."
                      exit 1
                    }
                  fi

                  [[ "${EXPECTED_ACCOUNT_ID}" =~ ^[0-9]{12}$ ]] || {
                    echo "::error::ACCOUNT_ID must contain exactly 12 digits."
                    exit 1
                  }

                  if [[ ! "${PLAN_ROLE_GITHUB_ARN}" =~ ^arn:[^:]+:iam::([0-9]{12}):role/.+ ]]; then
                    echo "::error::PLAN_ROLE_GITHUB_ARN is not a valid IAM role ARN."
                    exit 1
                  fi

                  [[ "${BASH_REMATCH[1]}" == "${EXPECTED_ACCOUNT_ID}" ]] || {
                    echo "::error::PLAN_ROLE_GITHUB_ARN belongs to the wrong AWS account."
                    exit 1
                  }

                  if [[ -n "${ALB_CERTIFICATE_ARN:-}" ]]; then
                    echo "TF_VAR_alb_certificate_arn=${ALB_CERTIFICATE_ARN}" >> "${GITHUB_ENV}"
                  fi

                  if [[ -n "${ALB_INGRESS_CIDRS:-}" ]]; then
                    if ! jq -e \
                      'type == "array" and all(.[]; type == "string" and length > 0)' \
                      <<< "${ALB_INGRESS_CIDRS}" >/dev/null; then
                      echo "::error::ALB_INGRESS_CIDRS must be a JSON array of non-empty strings."
                      exit 1
                    fi

                    echo "TF_VAR_alb_ingress_cidrs=${ALB_INGRESS_CIDRS}" >> "${GITHUB_ENV}"
                  fi

                  if [[ -n "${ALB_ACCESS_LOGS_ENABLED:-}" ]]; then
                    if [[ ! "${ALB_ACCESS_LOGS_ENABLED}" =~ ^(true|false)$ ]]; then
                      echo "::error::ALB_ACCESS_LOGS_ENABLED must be true or false when set."
                      exit 1
                    fi
                    echo "TF_VAR_alb_access_logs_enabled=${ALB_ACCESS_LOGS_ENABLED}" >> "${GITHUB_ENV}"
                  fi

                  if [[ -n "${ALB_ACCESS_LOGS_RETENTION_DAYS:-}" ]]; then
                    if [[ ! "${ALB_ACCESS_LOGS_RETENTION_DAYS}" =~ ^[1-9][0-9]*$ ]]; then
                      echo "::error::ALB_ACCESS_LOGS_RETENTION_DAYS must be a positive whole number."
                      exit 1
                    fi
                    echo "TF_VAR_alb_access_logs_retention_days=${ALB_ACCESS_LOGS_RETENTION_DAYS}" >> "${GITHUB_ENV}"
                  fi

                  if [[ -n "${RDS_INSTANCE_CLASS:-}" ]]; then
                    if [[ ! "${RDS_INSTANCE_CLASS}" =~ ^db\.[a-z0-9]+(\.[a-z0-9]+)*$ ]]; then
                      echo "::error::RDS_INSTANCE_CLASS must use RDS DB instance-class syntax such as db.t4g.micro."
                      exit 1
                    fi

                    echo "TF_VAR_rds_instance_class=${RDS_INSTANCE_CLASS}" >> "${GITHUB_ENV}"
                  fi

                  if [[ -n "${MAIN_VPC_CIDR:-}" ]]; then
                    if [[ ! "${MAIN_VPC_CIDR}" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}/16$ ]]; then
                      echo "::error::MAIN_VPC_CIDR must be an IPv4 /16 CIDR such as 10.0.0.0/16."
                      exit 1
                    fi

                    echo "TF_VAR_main_vpc_cidr=${MAIN_VPC_CIDR}" >> "${GITHUB_ENV}"
                  fi

                  {
                    echo "expected_account_id=${EXPECTED_ACCOUNT_ID}"
                    echo "primary_region=${AWS_REGION}"
                    echo "deployment_profile=${TF_VAR_deployment_profile}"
                    echo "production_retirement_mode=${TF_VAR_production_retirement_mode}"
                  } >> "${GITHUB_OUTPUT}"

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
              with:
                  role-to-assume: ${{ vars.PLAN_ROLE_GITHUB_ARN }}
                  aws-region: ${{ vars.PRIMARY_REGION }}
                  allowed-account-ids: ${{ vars.ACCOUNT_ID }}
                  role-session-name: tf-destroy-preflight-${{ github.run_id }}
                  unset-current-credentials: true

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
              with:
                  terraform_version: ${{ env.TERRAFORM_VERSION }}
                  terraform_wrapper: false

            - name: Configure optional WAF rate limit
              if: vars.WAF_RATE_LIMIT_REQUESTS != '' && vars.WAF_RATE_LIMIT_REQUESTS != 'null'
              shell: bash
              run: printf 'TF_VAR_waf_rate_limit_requests=%s\n' "$WAF_RATE_LIMIT_REQUESTS" >> "$GITHUB_ENV"

            - name: Initialize and validate Terraform
              shell: bash
              run: |
                  set -euo pipefail

                  aws sts get-caller-identity
                  terraform -chdir="${WORKING_DIRECTORY}" init -input=false -no-color
                  terraform -chdir="${WORKING_DIRECTORY}" validate -no-color

            - name: Verify production retirement convergence
              if: ${{ env.TF_VAR_deployment_profile == 'production' }}
              shell: bash
              run: |
                  set -euo pipefail

                  set +e
                  terraform -chdir="${WORKING_DIRECTORY}" plan \
                    -input=false -no-color -lock-timeout=5m -detailed-exitcode
                  rc=$?
                  set -e

                  case "${rc}" in
                    0)
                      echo "Production retirement configuration is converged."
                      ;;
                    2)
                      echo "::error::Stage-1 production retirement preparation is not converged."
                      echo "::error::Run Terraform Apply with production_retirement_mode=true first."
                      exit 1
                      ;;
                    *)
                      echo "::error::Terraform convergence check failed with exit code ${rc}."
                      exit "${rc}"
                      ;;
                  esac

            - name: Inventory production durable retirement data
              if: ${{ env.TF_VAR_deployment_profile == 'production' }}
              shell: bash
              run: |
                  set -euo pipefail

                  bash scripts/deployment/cleanup-retirement-durable-data.sh \
                    --environment "${{ inputs.environment }}" \
                    --mode plan \
                    --region "${AWS_REGION}" \
                    --expected-account-id "${EXPECTED_ACCOUNT_ID}"

            - name: Publish preflight summary
              if: always()
              shell: bash
              run: |
                  {
                    echo "# Terraform Destroy Preflight"
                    echo
                    echo "- Environment: \`${{ inputs.environment }}\`"
                    echo "- Commit: \`${GITHUB_SHA}\`"
                    echo "- AWS account: \`${EXPECTED_ACCOUNT_ID:-<not resolved>}\`"
                    echo "- Deployment profile: \`${TF_VAR_deployment_profile:-<not resolved>}\`"
                    echo "- Production retirement mode: \`${TF_VAR_production_retirement_mode:-<not resolved>}\`"
                    echo "- Durable-data deletion authorized: \`${DELETE_DURABLE_RETIREMENT_DATA:-<not resolved>}\`"
                    echo "- Audit-log disposition record: \`${AUDIT_LOG_DISPOSITION_REFERENCE:-<none>}\`"
                    echo "- Status: \`${{ job.status }}\`"
                  } >> "${GITHUB_STEP_SUMMARY}"

    production-durable-cleanup:
        name: Approve and delete prod durable retirement data
        needs: terraform-destroy-preflight
        if: ${{ needs.terraform-destroy-preflight.outputs.deployment_profile == 'production' && inputs.delete_durable_retirement_data }}
        runs-on: ubuntu-latest
        timeout-minutes: 30

        # Reusing the prod environment intentionally creates a protected,
        # separately approved deployment before durable data is deleted.
        environment: ${{ inputs.environment }}

        permissions:
            contents: read
            id-token: write

        env:
            WORKING_DIRECTORY: ./environments/${{ inputs.environment }}
            EXPECTED_ACCOUNT_ID: ${{ needs.terraform-destroy-preflight.outputs.expected_account_id }}
            AWS_REGION: ${{ needs.terraform-destroy-preflight.outputs.primary_region }}
            AWS_DEFAULT_REGION: ${{ needs.terraform-destroy-preflight.outputs.primary_region }}
            DEPLOYMENT_PROFILE: ${{ needs.terraform-destroy-preflight.outputs.deployment_profile }}
            PRODUCTION_RETIREMENT_MODE: ${{ needs.terraform-destroy-preflight.outputs.production_retirement_mode }}
            APPLY_ROLE_GITHUB_ARN: ${{ vars.APPLY_ROLE_GITHUB_ARN }}
            AUDIT_LOG_DISPOSITION_CONFIRMED: ${{ inputs.confirm_audit_log_disposition }}
            AUDIT_LOG_DISPOSITION_REFERENCE: ${{ inputs.audit_log_disposition_reference }}

        steps:
            - name: Checkout
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false

            - name: Validate durable cleanup authorization
              shell: bash
              run: |
                  set -euo pipefail

                  [[ "${{ inputs.confirm }}" == "DESTROY" ]] || {
                    echo "::error::Destroy confirmation changed or is invalid."
                    exit 1
                  }

                  [[ "${{ inputs.delete_durable_retirement_data }}" == "true" ]] || {
                    echo "::error::Durable-data deletion was not explicitly authorized."
                    exit 1
                  }

                  [[ "${DEPLOYMENT_PROFILE}" == "production" ]] || {
                    echo "::error::Durable-data cleanup may only run for deployment_profile=production."
                    exit 1
                  }

                  [[ "${PRODUCTION_RETIREMENT_MODE}" == "true" ]] || {
                    echo "::error::Durable-data cleanup requires production_retirement_mode=true."
                    exit 1
                  }

                  [[ "${EXPECTED_ACCOUNT_ID}" =~ ^[0-9]{12}$ ]] || {
                    echo "::error::Expected workload account ID is invalid."
                    exit 1
                  }

                  if [[ ! "${APPLY_ROLE_GITHUB_ARN}" =~ ^arn:[^:]+:iam::([0-9]{12}):role/.+ ]]; then
                    echo "::error::APPLY_ROLE_GITHUB_ARN is not a valid IAM role ARN."
                    exit 1
                  fi

                  [[ "${BASH_REMATCH[1]}" == "${EXPECTED_ACCOUNT_ID}" ]] || {
                    echo "::error::APPLY_ROLE_GITHUB_ARN belongs to the wrong AWS account."
                    exit 1
                  }

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
              with:
                  role-to-assume: ${{ vars.APPLY_ROLE_GITHUB_ARN }}
                  aws-region: ${{ env.AWS_REGION }}
                  allowed-account-ids: ${{ env.EXPECTED_ACCOUNT_ID }}
                  role-session-name: tf-retirement-durable-cleanup-${{ github.run_id }}
                  unset-current-credentials: true

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
              with:
                  terraform_version: ${{ env.TERRAFORM_VERSION }}
                  terraform_wrapper: false

            - name: Initialize Terraform
              shell: bash
              run: |
                  set -euo pipefail

                  aws sts get-caller-identity
                  terraform -chdir="${WORKING_DIRECTORY}" init -input=false -no-color

            - name: Delete approved durable retirement data
              shell: bash
              run: |
                  set -euo pipefail

                  bash scripts/deployment/cleanup-retirement-durable-data.sh \
                    --environment "${{ inputs.environment }}" \
                    --mode apply \
                    --confirm DELETE-DURABLE-DATA \
                    --region "${AWS_REGION}" \
                    --expected-account-id "${EXPECTED_ACCOUNT_ID}" \
                    --expected-apply-role-arn "${APPLY_ROLE_GITHUB_ARN}"

            - name: Verify production retirement readiness
              shell: bash
              run: |
                  set -euo pipefail

                  bash scripts/deployment/validate-retirement-readiness.sh \
                    --environment "${{ inputs.environment }}" \
                    --region "${AWS_REGION}" \
                    --expected-account-id "${EXPECTED_ACCOUNT_ID}"

    terraform-destroy-plan:
        name: Plan ${{ inputs.environment }} destroy
        needs:
            - terraform-destroy-preflight
            - production-durable-cleanup
        if: ${{ always() && needs.terraform-destroy-preflight.result == 'success' && (needs.production-durable-cleanup.result == 'success' || needs.production-durable-cleanup.result == 'skipped') }}
        runs-on: ubuntu-latest
        timeout-minutes: 30
        environment: ${{ format('{0}-plan', inputs.environment) }}

        permissions:
            contents: read
            id-token: write

        outputs:
            expected_account_id: ${{ steps.context.outputs.expected_account_id }}
            primary_region: ${{ steps.context.outputs.primary_region }}
            deployment_profile: ${{ steps.context.outputs.deployment_profile }}
            production_retirement_mode: ${{ steps.context.outputs.production_retirement_mode }}

        env:
            WORKING_DIRECTORY: ./environments/${{ inputs.environment }}
            EXPECTED_ACCOUNT_ID: ${{ needs.terraform-destroy-preflight.outputs.expected_account_id }}
            AWS_REGION: ${{ needs.terraform-destroy-preflight.outputs.primary_region }}
            AWS_DEFAULT_REGION: ${{ needs.terraform-destroy-preflight.outputs.primary_region }}
            PLAN_ROLE_GITHUB_ARN: ${{ vars.PLAN_ROLE_GITHUB_ARN }}

            TF_VAR_cloud_name: ${{ vars.CLOUD_NAME }}
            TF_VAR_environment: ${{ inputs.environment }}
            TF_VAR_primary_region: ${{ needs.terraform-destroy-preflight.outputs.primary_region }}
            TF_VAR_abuseipdb_api_key: ${{ secrets.ABUSEIPDB_API_KEY }}
            TF_VAR_bucket_admin_principals: ${{ vars.BUCKET_ADMIN_PRINCIPALS }}
            TF_VAR_tf_state_bucket_arn: ${{ vars.TF_STATE_BUCKET_ARN }}
            TF_VAR_tf_state_bucket_cmk_arn: ${{ vars.TF_STATE_BUCKET_CMK_ARN }}
            TF_VAR_deployment_profile: ${{ needs.terraform-destroy-preflight.outputs.deployment_profile }}
            TF_VAR_break_glass_trusted_principal_arns: ${{ vars.BREAK_GLASS_TRUSTED_PRINCIPAL_ARNS }}
            TF_VAR_secops_emails: ${{ vars.SECOPS_EMAILS }}
            TF_VAR_isolation_allowed: ${{ vars.ISOLATION_ALLOWED }}
            TF_VAR_additional_interface_endpoint_services: ${{ vars.ADDITIONAL_INTERFACE_ENDPOINT_SERVICES || '[]' }}
            TF_VAR_production_retirement_mode: ${{ needs.terraform-destroy-preflight.outputs.production_retirement_mode }}
            TF_VAR_waf_enabled: ${{ vars.WAF_ENABLED || 'false' }}
            TF_VAR_waf_mode: ${{ vars.WAF_MODE || 'count' }}
            WAF_RATE_LIMIT_REQUESTS: ${{ vars.WAF_RATE_LIMIT_REQUESTS }}
            TF_VAR_waf_sampled_requests_enabled: ${{ vars.WAF_SAMPLED_REQUESTS_ENABLED || 'false' }}
            ALB_CERTIFICATE_ARN: ${{ vars.ALB_CERTIFICATE_ARN }}
            ALB_INGRESS_CIDRS: ${{ vars.ALB_INGRESS_CIDRS }}
            ALB_ACCESS_LOGS_ENABLED: ${{ vars.ALB_ACCESS_LOGS_ENABLED }}
            ALB_ACCESS_LOGS_RETENTION_DAYS: ${{ vars.ALB_ACCESS_LOGS_RETENTION_DAYS }}
            RDS_INSTANCE_CLASS: ${{ vars.RDS_INSTANCE_CLASS }}
            MAIN_VPC_CIDR: ${{ vars.MAIN_VPC_CIDR }}

        steps:
            - name: Checkout
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false

            - name: Carry forward destroy context
              id: context
              shell: bash
              run: |
                  set -euo pipefail

                  [[ "${EXPECTED_ACCOUNT_ID}" =~ ^[0-9]{12}$ ]] || {
                    echo "::error::Expected workload account ID is invalid."
                    exit 1
                  }

                  if [[ ! "${PLAN_ROLE_GITHUB_ARN}" =~ ^arn:[^:]+:iam::([0-9]{12}):role/.+ ]]; then
                    echo "::error::PLAN_ROLE_GITHUB_ARN is not a valid IAM role ARN."
                    exit 1
                  fi

                  [[ "${BASH_REMATCH[1]}" == "${EXPECTED_ACCOUNT_ID}" ]] || {
                    echo "::error::PLAN_ROLE_GITHUB_ARN belongs to the wrong AWS account."
                    exit 1
                  }

                  if [[ -n "${ALB_CERTIFICATE_ARN:-}" ]]; then
                    echo "TF_VAR_alb_certificate_arn=${ALB_CERTIFICATE_ARN}" >> "${GITHUB_ENV}"
                  fi

                  if [[ -n "${ALB_INGRESS_CIDRS:-}" ]]; then
                    if ! jq -e \
                      'type == "array" and all(.[]; type == "string" and length > 0)' \
                      <<< "${ALB_INGRESS_CIDRS}" >/dev/null; then
                      echo "::error::ALB_INGRESS_CIDRS must be a JSON array of non-empty strings."
                      exit 1
                    fi

                    echo "TF_VAR_alb_ingress_cidrs=${ALB_INGRESS_CIDRS}" >> "${GITHUB_ENV}"
                  fi

                  if [[ -n "${ALB_ACCESS_LOGS_ENABLED:-}" ]]; then
                    if [[ ! "${ALB_ACCESS_LOGS_ENABLED}" =~ ^(true|false)$ ]]; then
                      echo "::error::ALB_ACCESS_LOGS_ENABLED must be true or false when set."
                      exit 1
                    fi
                    echo "TF_VAR_alb_access_logs_enabled=${ALB_ACCESS_LOGS_ENABLED}" >> "${GITHUB_ENV}"
                  fi

                  if [[ -n "${ALB_ACCESS_LOGS_RETENTION_DAYS:-}" ]]; then
                    if [[ ! "${ALB_ACCESS_LOGS_RETENTION_DAYS}" =~ ^[1-9][0-9]*$ ]]; then
                      echo "::error::ALB_ACCESS_LOGS_RETENTION_DAYS must be a positive whole number."
                      exit 1
                    fi
                    echo "TF_VAR_alb_access_logs_retention_days=${ALB_ACCESS_LOGS_RETENTION_DAYS}" >> "${GITHUB_ENV}"
                  fi

                  if [[ -n "${RDS_INSTANCE_CLASS:-}" ]]; then
                    if [[ ! "${RDS_INSTANCE_CLASS}" =~ ^db\.[a-z0-9]+(\.[a-z0-9]+)*$ ]]; then
                      echo "::error::RDS_INSTANCE_CLASS must use RDS DB instance-class syntax such as db.t4g.micro."
                      exit 1
                    fi

                    echo "TF_VAR_rds_instance_class=${RDS_INSTANCE_CLASS}" >> "${GITHUB_ENV}"
                  fi

                  if [[ -n "${MAIN_VPC_CIDR:-}" ]]; then
                    if [[ ! "${MAIN_VPC_CIDR}" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}/16$ ]]; then
                      echo "::error::MAIN_VPC_CIDR must be an IPv4 /16 CIDR such as 10.0.0.0/16."
                      exit 1
                    fi

                    echo "TF_VAR_main_vpc_cidr=${MAIN_VPC_CIDR}" >> "${GITHUB_ENV}"
                  fi

                  {
                    echo "expected_account_id=${EXPECTED_ACCOUNT_ID}"
                    echo "primary_region=${AWS_REGION}"
                    echo "deployment_profile=${TF_VAR_deployment_profile}"
                    echo "production_retirement_mode=${TF_VAR_production_retirement_mode}"
                  } >> "${GITHUB_OUTPUT}"

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
              with:
                  role-to-assume: ${{ vars.PLAN_ROLE_GITHUB_ARN }}
                  aws-region: ${{ env.AWS_REGION }}
                  allowed-account-ids: ${{ env.EXPECTED_ACCOUNT_ID }}
                  role-session-name: tf-destroy-plan-${{ github.run_id }}
                  unset-current-credentials: true

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
              with:
                  terraform_version: ${{ env.TERRAFORM_VERSION }}
                  terraform_wrapper: false

            - name: Configure optional WAF rate limit
              if: vars.WAF_RATE_LIMIT_REQUESTS != '' && vars.WAF_RATE_LIMIT_REQUESTS != 'null'
              shell: bash
              run: printf 'TF_VAR_waf_rate_limit_requests=%s\n' "$WAF_RATE_LIMIT_REQUESTS" >> "$GITHUB_ENV"

            - name: Initialize and validate Terraform
              shell: bash
              run: |
                  set -euo pipefail

                  aws sts get-caller-identity
                  terraform -chdir="${WORKING_DIRECTORY}" init -input=false -no-color
                  terraform -chdir="${WORKING_DIRECTORY}" validate -no-color

            - name: Reconfirm production retirement readiness
              if: ${{ env.TF_VAR_deployment_profile == 'production' }}
              shell: bash
              run: |
                  set -euo pipefail

                  set +e
                  terraform -chdir="${WORKING_DIRECTORY}" plan \
                    -input=false -no-color -lock-timeout=5m -detailed-exitcode
                  rc=$?
                  set -e

                  case "${rc}" in
                    0)
                      echo "Production retirement configuration remains converged."
                      ;;
                    2)
                      echo "::error::Production retirement configuration changed after durable-data cleanup."
                      exit 1
                      ;;
                    *)
                      echo "::error::Terraform convergence check failed with exit code ${rc}."
                      exit "${rc}"
                      ;;
                  esac

                  bash scripts/deployment/validate-retirement-readiness.sh \
                    --environment "${{ inputs.environment }}" \
                    --region "${AWS_REGION}" \
                    --expected-account-id "${EXPECTED_ACCOUNT_ID}"

            - name: Create exact saved destroy plan
              shell: bash
              run: |
                  set -euo pipefail

                  context="$(
                    jq -cn \
                      --arg operation workload-destroy \
                      --arg environment "${{ inputs.environment }}" \
                      --arg expected_account_id "${EXPECTED_ACCOUNT_ID}" \
                      --arg primary_region "${AWS_REGION}" \
                      --arg deployment_profile "${TF_VAR_deployment_profile}" \
                      --argjson production_retirement_mode "${TF_VAR_production_retirement_mode}" \
                      '{operation:$operation, environment:$environment,
                        expected_account_id:$expected_account_id, primary_region:$primary_region,
                        deployment_profile:$deployment_profile,
                        production_retirement_mode:$production_retirement_mode}'
                  )"

                  bash scripts/deployment/terraform-plan-artifact.sh create \
                    --mode destroy \
                    --working-directory "${WORKING_DIRECTORY}" \
                    --artifact-directory "${GITHUB_WORKSPACE}/${DESTROY_ARTIFACT_DIR}" \
                    --artifact-basename "${DESTROY_PLAN_BASENAME}" \
                    --context-json "${context}"

            - name: Publish destroy plan
              if: always()
              shell: bash
              run: |
                  {
                    echo "# Terraform Destroy Plan"
                    echo
                    echo "- Environment: \`${{ inputs.environment }}\`"
                    echo "- Commit: \`${GITHUB_SHA}\`"
                    echo "- AWS account: \`${EXPECTED_ACCOUNT_ID:-<not resolved>}\`"
                    echo "- Deployment profile: \`${TF_VAR_deployment_profile:-<not resolved>}\`"
                    echo "- Production retirement mode: \`${TF_VAR_production_retirement_mode:-<not resolved>}\`"
                    echo "- Durable-data cleanup authorized: \`${{ inputs.delete_durable_retirement_data }}\`"
                    echo "- Status: \`${{ job.status }}\`"
                    echo
                  } >> "${GITHUB_STEP_SUMMARY}"

                  plan_text="${GITHUB_WORKSPACE}/${DESTROY_ARTIFACT_DIR}/${DESTROY_PLAN_BASENAME}-plan.txt"
                  if [[ -f "${plan_text}" ]]; then
                    {
                      echo "<details><summary>View exact destroy plan</summary>"
                      echo
                      echo '```text'
                      cat "${plan_text}"
                      echo '```'
                      echo
                      echo "</details>"
                    } >> "${GITHUB_STEP_SUMMARY}"
                  fi

            - name: Upload saved destroy plan
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: ${{ env.DESTROY_ARTIFACT_NAME }}
                  path: ${{ github.workspace }}/${{ env.DESTROY_ARTIFACT_DIR }}
                  if-no-files-found: error
                  retention-days: 1

    terraform-destroy-apply:
        name: Apply reviewed ${{ inputs.environment }} destroy plan
        needs: [terraform-destroy-plan]
        if: ${{ always() && needs.terraform-destroy-plan.result == 'success' }}
        runs-on: ubuntu-latest
        timeout-minutes: 60
        environment: ${{ inputs.environment }}
        permissions:
            contents: read
            id-token: write

        env:
            WORKING_DIRECTORY: ./environments/${{ inputs.environment }}
            EXPECTED_ACCOUNT_ID: ${{ needs.terraform-destroy-plan.outputs.expected_account_id }}
            AWS_REGION: ${{ needs.terraform-destroy-plan.outputs.primary_region }}
            AWS_DEFAULT_REGION: ${{ needs.terraform-destroy-plan.outputs.primary_region }}
            DEPLOYMENT_PROFILE: ${{ needs.terraform-destroy-plan.outputs.deployment_profile }}
            PRODUCTION_RETIREMENT_MODE: ${{ needs.terraform-destroy-plan.outputs.production_retirement_mode }}
            APPLY_ROLE_GITHUB_ARN: ${{ vars.APPLY_ROLE_GITHUB_ARN }}
            AUDIT_LOG_DISPOSITION_CONFIRMED: ${{ inputs.confirm_audit_log_disposition }}
            AUDIT_LOG_DISPOSITION_REFERENCE: ${{ inputs.audit_log_disposition_reference }}

        steps:
            - name: Checkout
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false

            - name: Validate Apply settings
              shell: bash
              run: |
                  set -euo pipefail

                  [[ "${EXPECTED_ACCOUNT_ID}" =~ ^[0-9]{12}$ ]] || {
                    echo "::error::Expected workload account ID is invalid."
                    exit 1
                  }

                  case "${DEPLOYMENT_PROFILE}" in
                    production|development|minimal) ;;
                    *)
                      echo "::error::Saved destroy plan has an invalid deployment profile."
                      exit 1
                      ;;
                  esac

                  [[ "${PRODUCTION_RETIREMENT_MODE}" =~ ^(true|false)$ ]] || {
                    echo "::error::Saved destroy plan has an invalid retirement-mode value."
                    exit 1
                  }

                  if [[ "${DEPLOYMENT_PROFILE}" == "production" &&
                        "${PRODUCTION_RETIREMENT_MODE}" != "true" ]]; then
                    echo "::error::Production destroy plan is not bound to retirement mode."
                    exit 1
                  fi

                  if [[ ! "${APPLY_ROLE_GITHUB_ARN}" =~ ^arn:[^:]+:iam::([0-9]{12}):role/.+ ]]; then
                    echo "::error::APPLY_ROLE_GITHUB_ARN is not a valid IAM role ARN."
                    exit 1
                  fi

                  [[ "${BASH_REMATCH[1]}" == "${EXPECTED_ACCOUNT_ID}" ]] || {
                    echo "::error::APPLY_ROLE_GITHUB_ARN belongs to the wrong AWS account."
                    exit 1
                  }

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
              with:
                  role-to-assume: ${{ vars.APPLY_ROLE_GITHUB_ARN }}
                  aws-region: ${{ env.AWS_REGION }}
                  allowed-account-ids: ${{ env.EXPECTED_ACCOUNT_ID }}
                  role-session-name: tf-destroy-apply-${{ github.run_id }}
                  unset-current-credentials: true

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
              with:
                  terraform_version: ${{ env.TERRAFORM_VERSION }}
                  terraform_wrapper: false

            - name: Initialize Terraform
              shell: bash
              run: |
                  set -euo pipefail
                  aws sts get-caller-identity
                  terraform -chdir="${WORKING_DIRECTORY}" init -input=false -no-color

            - name: Download reviewed destroy plan
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: ${{ env.DESTROY_ARTIFACT_NAME }}
                  path: ${{ github.workspace }}/${{ env.DESTROY_ARTIFACT_DIR }}

            - name: Reverify production log-bucket policy role exception
              if: ${{ env.DEPLOYMENT_PROFILE == 'production' }}
              shell: bash
              run: |
                  set -euo pipefail
                  bash scripts/deployment/validate-log-bucket-destroy-principal.sh \
                    --working-directory "${WORKING_DIRECTORY}" \
                    --expected-account-id "${EXPECTED_ACCOUNT_ID}" \
                    --expected-role-arn "${APPLY_ROLE_GITHUB_ARN}" \
                    --region "${AWS_REGION}"

            - name: Verify readiness and apply exact destroy artifact
              shell: bash
              run: |
                  set -euo pipefail

                  context="$(
                    jq -cn \
                      --arg operation workload-destroy \
                      --arg environment "${{ inputs.environment }}" \
                      --arg expected_account_id "${EXPECTED_ACCOUNT_ID}" \
                      --arg primary_region "${AWS_REGION}" \
                      --arg deployment_profile "${DEPLOYMENT_PROFILE}" \
                      --argjson production_retirement_mode "${PRODUCTION_RETIREMENT_MODE}" \
                      '{operation:$operation, environment:$environment,
                        expected_account_id:$expected_account_id, primary_region:$primary_region,
                        deployment_profile:$deployment_profile,
                        production_retirement_mode:$production_retirement_mode}'
                  )"

                  bash scripts/deployment/terraform-plan-artifact.sh verify \
                    --mode destroy \
                    --working-directory "${WORKING_DIRECTORY}" \
                    --artifact-directory "${GITHUB_WORKSPACE}/${DESTROY_ARTIFACT_DIR}" \
                    --artifact-basename "${DESTROY_PLAN_BASENAME}" \
                    --context-json "${context}"

                  if [[ "${DEPLOYMENT_PROFILE}" == "production" ]]; then
                    bash scripts/deployment/validate-retirement-readiness.sh \
                      --environment "${{ inputs.environment }}" \
                      --region "${AWS_REGION}" \
                      --expected-account-id "${EXPECTED_ACCOUNT_ID}"
                  fi

                  terraform -chdir="${WORKING_DIRECTORY}" apply \
                    -input=false -no-color -lock-timeout=5m \
                    "${GITHUB_WORKSPACE}/${DESTROY_ARTIFACT_DIR}/${DESTROY_PLAN_BASENAME}.tfplan"

            - name: Publish destroy result
              if: always()
              run: |
                  {
                    echo "# Terraform Destroy"
                    echo
                    echo "- Environment: \`${{ inputs.environment }}\`"
                    echo "- Commit: \`${GITHUB_SHA}\`"
                    echo "- AWS account: \`${EXPECTED_ACCOUNT_ID}\`"
                    echo "- Deployment profile: \`${DEPLOYMENT_PROFILE}\`"
                    echo "- Production retirement mode: \`${PRODUCTION_RETIREMENT_MODE}\`"
                    echo "- Audit-log disposition record: \`${AUDIT_LOG_DISPOSITION_REFERENCE:-<none>}\`"
                    echo "- Status: \`${{ job.status }}\`"
                  } >> "${GITHUB_STEP_SUMMARY}"
