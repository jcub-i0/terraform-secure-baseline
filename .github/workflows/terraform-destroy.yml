name: Terraform Destroy

on:
    workflow_dispatch:
        inputs:
            environment:
                description: "Environment to destroy"
                required: true
                type: choice
                options:
                    - dev
                    - staging
                    - prod
            confirm:
                description: "Type DESTROY to destroy infrastructure"
                required: true

permissions:
    id-token: write
    contents: read

concurrency:
    group: terraform-destroy-${{ inputs.environment }}
    cancel-in-progress: false

jobs:
    identity-center-cleanup:
      if: ${{inputs.confirm == 'DESTROY'}}
      runs-on: ubuntu-latest
      environment: control-plane

      env:
        TF_VAR_identity_center_workloads: ${{ vars.IDENTITY_CENTER_WORKLOADS }}
        TF_VAR_identity_center_secops: ${{ vars.IDENTITY_CENTER_SECOPS }}

      steps:
        - name: Checkout
          uses: actions/checkout@v6

        - name: Configure AWS credentials for Control Plane
          uses: aws-actions/configure-aws-credentials@v6
          with:
            role-to-assume: ${{ vars.APPLY_ROLE_GITHUB_ARN }}
            aws-region: ${{ vars.PRIMARY_REGION }}

        - name: Verify control-plane identity
          run: aws sts get-caller-identity

        - name: Setup Terraform
          uses: hashicorp/setup-terraform@v4

        - name: Prepare Identity Center cleanup inputs
          shell: bash
          env:
            TARGET_ENVIRONMENT: ${{ inputs.environment }}
          run: |
            set -euo pipefail

            if ! jq -e --arg environment "${TARGET_ENVIRONMENT}" '
              type == "object" and
              has($environment) and
              (.[$environment] | type == "object")
            ' <<< "${TF_VAR_identity_center_workloads}" >/dev/null; then
              echo "::error::IDENTITY_CENTER_WORKLOADS does not contain a valid '${TARGET_ENVIRONMENT}' configuration."
              exit 1
            fi

            updated_workloads="$(
              jq -c --arg environment "${TARGET_ENVIRONMENT}" '
                .[$environment].enable_secops_analyst = false |
                .[$environment].enable_secops_engineer = false
              ' <<< "${TF_VAR_identity_center_workloads}"
            )"

            echo "TF_VAR_identity_center_workloads=${updated_workloads}" >> "${GITHUB_ENV}"

        - name: Terraform Init Identity Center
          working-directory: ./bootstrap/control_plane/identity_center
          run: terraform init

        - name: Identity Center Cleanup Plan
          working-directory: ./bootstrap/control_plane/identity_center
          shell: bash
          run: |
            set -euo pipefail
            terraform plan -input=false -no-color -lock-timeout=5m

        - name: Identity Center Cleanup
          working-directory: ./bootstrap/control_plane/identity_center
          shell: bash
          run: |
            set -euo pipefail
            terraform apply -auto-approve -input=false -no-color

    terraform-destroy:
        needs: identity-center-cleanup
        if: ${{inputs.confirm == 'DESTROY'}}
        runs-on: ubuntu-latest
        environment: ${{inputs.environment}}

        env:
            TF_VAR_cloud_name: ${{ vars.CLOUD_NAME }}
            TF_VAR_environment: ${{ vars.ENVIRONMENT }}
            TF_VAR_primary_region: ${{ vars.PRIMARY_REGION }}
            TF_VAR_abuseipdb_api_key: ${{ secrets.ABUSEIPDB_API_KEY }}
            TF_VAR_bucket_admin_principals: ${{ vars.BUCKET_ADMIN_PRINCIPALS }}
            TF_VAR_tf_state_bucket_arn: ${{ vars.TF_STATE_BUCKET_ARN }}
            TF_VAR_tf_state_bucket_cmk_arn: ${{ vars.TF_STATE_BUCKET_CMK_ARN }}
            TF_VAR_break_glass_trusted_principal_arns: ${{ vars.BREAK_GLASS_TRUSTED_PRINCIPAL_ARNS }}
            TF_VAR_secops_emails: ${{ vars.SECOPS_EMAILS }}
            TF_VAR_isolation_allowed: ${{ vars.ISOLATION_ALLOWED || 'false' }}

        steps:
            - name: Confirm destroy
              run: |
                if [ "${{ github.event.inputs.confirm }}" != "DESTROY" ]; then
                    echo "Confirmation failed. Aborting."
                    exit 1
                fi

            - name: Checkout
              uses: actions/checkout@v6

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v6
              with:
                role-to-assume: ${{ vars.APPLY_ROLE_GITHUB_ARN }}
                aws-region: ${{ vars.PRIMARY_REGION }}

            - name: Verify identity
              run: aws sts get-caller-identity

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v4

            - name: Terraform Init
              working-directory: ./environments/${{ inputs.environment }}
              run: terraform init

            - name: Print destroy target
              run: echo "Destroying environment - ${{ inputs.environment }}"

            - name: Terraform Destroy
              working-directory: ./environments/${{ inputs.environment }}
              shell: bash
              run: |
                set -euo pipefail
                terraform destroy -auto-approve -input=false -no-color