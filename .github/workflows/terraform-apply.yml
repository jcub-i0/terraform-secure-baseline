name: Terraform Apply

run-name: Terraform apply - ${{ inputs.environment }}

on:
    workflow_dispatch:
        inputs:
            environment:
                description: "Environment to deploy"
                required: true
                type: choice
                options: [dev, staging, prod]
            production_retirement_mode:
                description: "Enable production retirement posture; durable Backup/ECR data is handled separately"
                required: true
                default: false
                type: boolean
            reconcile_workload_account:
                description: "Reconcile the workload account after a successful baseline apply"
                required: true
                default: false
                type: boolean

permissions: {}

concurrency:
    group: terraform-workload-${{ inputs.environment }}
    cancel-in-progress: false

env:
    AWS_PAGER: ""
    TF_IN_AUTOMATION: "true"
    TF_INPUT: "false"
    TERRAFORM_VERSION: "1.15.8"

    PLAN_ARTIFACT_NAME: terraform-baseline-plan-${{ inputs.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
    PLAN_ARTIFACT_DIR: terraform-plan-artifact
    PLAN_BASENAME: baseline

jobs:
    terraform-plan:
        name: Plan ${{ inputs.environment }} baseline
        runs-on: ubuntu-latest
        timeout-minutes: 30
        environment: ${{ format('{0}-plan', inputs.environment) }}

        permissions:
            contents: read
            id-token: write

        outputs:
            expected_account_id: ${{ steps.context.outputs.expected_account_id }}
            primary_region: ${{ steps.context.outputs.primary_region }}
            deployment_profile: ${{ steps.context.outputs.deployment_profile }}

        env:
            WORKING_DIRECTORY: ./environments/${{ inputs.environment }}
            EXPECTED_ACCOUNT_ID: ${{ vars.ACCOUNT_ID }}
            AWS_REGION: ${{ vars.PRIMARY_REGION }}
            AWS_DEFAULT_REGION: ${{ vars.PRIMARY_REGION }}
            PLAN_ROLE_GITHUB_ARN: ${{ vars.PLAN_ROLE_GITHUB_ARN }}

            TF_VAR_cloud_name: ${{ vars.CLOUD_NAME }}
            TF_VAR_environment: ${{ inputs.environment }}
            TF_VAR_primary_region: ${{ vars.PRIMARY_REGION }}
            TF_VAR_abuseipdb_api_key: ${{ secrets.ABUSEIPDB_API_KEY }}
            TF_VAR_bucket_admin_principals: ${{ vars.BUCKET_ADMIN_PRINCIPALS }}
            TF_VAR_tf_state_bucket_arn: ${{ vars.TF_STATE_BUCKET_ARN }}
            TF_VAR_tf_state_bucket_cmk_arn: ${{ vars.TF_STATE_BUCKET_CMK_ARN }}
            TF_VAR_deployment_profile: ${{ vars.DEPLOYMENT_PROFILE }}
            TF_VAR_break_glass_trusted_principal_arns: ${{ vars.BREAK_GLASS_TRUSTED_PRINCIPAL_ARNS }}
            TF_VAR_secops_emails: ${{ vars.SECOPS_EMAILS }}
            TF_VAR_isolation_allowed: ${{ vars.ISOLATION_ALLOWED }}
            TF_VAR_production_retirement_mode: ${{ inputs.production_retirement_mode }}

        steps:
            - name: Checkout
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false

            - name: Validate Plan settings
              id: context
              shell: bash
              run: |
                  set -euo pipefail

                  required=(
                    EXPECTED_ACCOUNT_ID
                    AWS_REGION
                    PLAN_ROLE_GITHUB_ARN
                    TF_VAR_cloud_name
                    TF_VAR_environment
                    TF_VAR_primary_region
                    TF_VAR_bucket_admin_principals
                    TF_VAR_tf_state_bucket_arn
                    TF_VAR_tf_state_bucket_cmk_arn
                    TF_VAR_deployment_profile
                    TF_VAR_isolation_allowed
                  )

                  for name in "${required[@]}"; do
                    [[ -n "${!name:-}" ]] || {
                      echo "::error::${name} is not configured."
                      exit 1
                    }
                  done

                  case "${TF_VAR_deployment_profile}" in
                    production|development|minimal) ;;
                    *)
                      echo "::error::DEPLOYMENT_PROFILE must be production, development, or minimal."
                      exit 1
                      ;;
                  esac

                  [[ "${TF_VAR_isolation_allowed}" =~ ^(true|false)$ ]] || {
                    echo "::error::ISOLATION_ALLOWED must be exactly true or false."
                    exit 1
                  }

                  [[ "${TF_VAR_production_retirement_mode}" =~ ^(true|false)$ ]] || {
                    echo "::error::production_retirement_mode must be exactly true or false."
                    exit 1
                  }

                  if [[ "${TF_VAR_production_retirement_mode}" == "true" &&
                        "${TF_VAR_deployment_profile}" != "production" ]]; then
                    echo "::error::production_retirement_mode=true requires deployment_profile=production."
                    exit 1
                  fi

                  if [[ "${TF_VAR_production_retirement_mode}" == "true" &&
                        "${{ inputs.reconcile_workload_account }}" == "true" ]]; then
                    echo "::error::reconcile_workload_account must be false during production retirement."
                    exit 1
                  fi

                  [[ "${EXPECTED_ACCOUNT_ID}" =~ ^[0-9]{12}$ ]] || {
                    echo "::error::ACCOUNT_ID must contain exactly 12 digits."
                    exit 1
                  }

                  if [[ ! "${PLAN_ROLE_GITHUB_ARN}" =~ ^arn:[^:]+:iam::([0-9]{12}):role/.+ ]]; then
                    echo "::error::PLAN_ROLE_GITHUB_ARN is not a valid IAM role ARN."
                    exit 1
                  fi

                  [[ "${BASH_REMATCH[1]}" == "${EXPECTED_ACCOUNT_ID}" ]] || {
                    echo "::error::PLAN_ROLE_GITHUB_ARN belongs to the wrong AWS account."
                    exit 1
                  }

                  {
                    echo "expected_account_id=${EXPECTED_ACCOUNT_ID}"
                    echo "primary_region=${AWS_REGION}"
                    echo "deployment_profile=${TF_VAR_deployment_profile}"
                  } >> "${GITHUB_OUTPUT}"

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
              with:
                  role-to-assume: ${{ vars.PLAN_ROLE_GITHUB_ARN }}
                  aws-region: ${{ vars.PRIMARY_REGION }}
                  allowed-account-ids: ${{ vars.ACCOUNT_ID }}
                  role-session-name: tf-apply-plan-${{ github.run_id }}
                  unset-current-credentials: true

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
              with:
                  terraform_version: ${{ env.TERRAFORM_VERSION }}
                  terraform_wrapper: false

            - name: Initialize and validate Terraform
              shell: bash
              run: |
                  set -euo pipefail

                  aws sts get-caller-identity
                  terraform -chdir="${WORKING_DIRECTORY}" init -input=false -no-color
                  terraform -chdir="${WORKING_DIRECTORY}" validate -no-color

            - name: Create exact saved plan
              shell: bash
              run: |
                  set -euo pipefail

                  context="$(
                    jq -cn \
                      --arg operation baseline-apply \
                      --arg environment "${{ inputs.environment }}" \
                      --arg expected_account_id "${EXPECTED_ACCOUNT_ID}" \
                      --arg primary_region "${AWS_REGION}" \
                      --arg deployment_profile "${TF_VAR_deployment_profile}" \
                      --argjson production_retirement_mode "${TF_VAR_production_retirement_mode}" \
                      --argjson reconcile_workload_account "${{ inputs.reconcile_workload_account }}" \
                      '{
                        operation: $operation,
                        environment: $environment,
                        expected_account_id: $expected_account_id,
                        primary_region: $primary_region,
                        deployment_profile: $deployment_profile,
                        production_retirement_mode: $production_retirement_mode,
                        reconcile_workload_account: $reconcile_workload_account
                      }'
                  )"

                  bash scripts/deployment/terraform-plan-artifact.sh create \
                    --mode apply \
                    --working-directory "${WORKING_DIRECTORY}" \
                    --artifact-directory "${GITHUB_WORKSPACE}/${PLAN_ARTIFACT_DIR}" \
                    --artifact-basename "${PLAN_BASENAME}" \
                    --context-json "${context}"

            - name: Publish plan summary
              if: always()
              shell: bash
              run: |
                  {
                    echo "# Terraform Baseline Plan"
                    echo
                    echo "- Environment: \`${{ inputs.environment }}\`"
                    echo "- Commit: \`${GITHUB_SHA}\`"
                    echo "- AWS account: \`${EXPECTED_ACCOUNT_ID:-<not resolved>}\`"
                    echo "- Deployment profile: \`${TF_VAR_deployment_profile:-<not resolved>}\`"
                    echo "- Production retirement mode: \`${{ inputs.production_retirement_mode }}\`"
                    echo "- Reconcile after apply: \`${{ inputs.reconcile_workload_account }}\`"
                    echo "- Status: \`${{ job.status }}\`"
                    echo
                    echo "The protected Apply job will use this exact saved plan."
                  } >> "${GITHUB_STEP_SUMMARY}"

                  plan_text="${GITHUB_WORKSPACE}/${PLAN_ARTIFACT_DIR}/${PLAN_BASENAME}-plan.txt"
                  if [[ -f "${plan_text}" ]]; then
                    {
                      echo "<details><summary>View Terraform plan</summary>"
                      echo
                      echo '```text'
                      cat "${plan_text}"
                      echo '```'
                      echo
                      echo "</details>"
                    } >> "${GITHUB_STEP_SUMMARY}"
                  fi

            - name: Upload saved plan
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: ${{ env.PLAN_ARTIFACT_NAME }}
                  path: ${{ github.workspace }}/${{ env.PLAN_ARTIFACT_DIR }}
                  if-no-files-found: error
                  retention-days: 1

    terraform-apply:
        name: Apply reviewed ${{ inputs.environment }} plan
        needs: terraform-plan
        runs-on: ubuntu-latest
        timeout-minutes: 45
        environment: ${{ inputs.environment }}

        permissions:
            contents: read
            id-token: write

        env:
            WORKING_DIRECTORY: ./environments/${{ inputs.environment }}
            EXPECTED_ACCOUNT_ID: ${{ needs.terraform-plan.outputs.expected_account_id }}
            AWS_REGION: ${{ needs.terraform-plan.outputs.primary_region }}
            AWS_DEFAULT_REGION: ${{ needs.terraform-plan.outputs.primary_region }}
            DEPLOYMENT_PROFILE: ${{ needs.terraform-plan.outputs.deployment_profile }}
            APPLY_ROLE_GITHUB_ARN: ${{ vars.APPLY_ROLE_GITHUB_ARN }}

        steps:
            - name: Checkout
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false

            - name: Validate Apply settings
              shell: bash
              run: |
                  set -euo pipefail

                  [[ "${EXPECTED_ACCOUNT_ID}" =~ ^[0-9]{12}$ ]] || {
                    echo "::error::Expected account ID is invalid."
                    exit 1
                  }

                  if [[ ! "${APPLY_ROLE_GITHUB_ARN}" =~ ^arn:[^:]+:iam::([0-9]{12}):role/.+ ]]; then
                    echo "::error::APPLY_ROLE_GITHUB_ARN is not a valid IAM role ARN."
                    exit 1
                  fi

                  [[ "${BASH_REMATCH[1]}" == "${EXPECTED_ACCOUNT_ID}" ]] || {
                    echo "::error::APPLY_ROLE_GITHUB_ARN belongs to the wrong AWS account."
                    exit 1
                  }

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
              with:
                  role-to-assume: ${{ vars.APPLY_ROLE_GITHUB_ARN }}
                  aws-region: ${{ env.AWS_REGION }}
                  allowed-account-ids: ${{ env.EXPECTED_ACCOUNT_ID }}
                  role-session-name: tf-apply-${{ github.run_id }}
                  unset-current-credentials: true

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
              with:
                  terraform_version: ${{ env.TERRAFORM_VERSION }}
                  terraform_wrapper: false

            - name: Initialize Terraform
              shell: bash
              run: |
                  set -euo pipefail

                  aws sts get-caller-identity
                  terraform -chdir="${WORKING_DIRECTORY}" init -input=false -no-color

            - name: Download reviewed plan
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: ${{ env.PLAN_ARTIFACT_NAME }}
                  path: ${{ github.workspace }}/${{ env.PLAN_ARTIFACT_DIR }}

            - name: Verify and apply exact saved plan
              shell: bash
              run: |
                  set -euo pipefail

                  context="$(
                    jq -cn \
                      --arg operation baseline-apply \
                      --arg environment "${{ inputs.environment }}" \
                      --arg expected_account_id "${EXPECTED_ACCOUNT_ID}" \
                      --arg primary_region "${AWS_REGION}" \
                      --arg deployment_profile "${DEPLOYMENT_PROFILE}" \
                      --argjson production_retirement_mode "${{ inputs.production_retirement_mode }}" \
                      --argjson reconcile_workload_account "${{ inputs.reconcile_workload_account }}" \
                      '{
                        operation: $operation,
                        environment: $environment,
                        expected_account_id: $expected_account_id,
                        primary_region: $primary_region,
                        deployment_profile: $deployment_profile,
                        production_retirement_mode: $production_retirement_mode,
                        reconcile_workload_account: $reconcile_workload_account
                      }'
                  )"

                  bash scripts/deployment/terraform-plan-artifact.sh verify \
                    --mode apply \
                    --working-directory "${WORKING_DIRECTORY}" \
                    --artifact-directory "${GITHUB_WORKSPACE}/${PLAN_ARTIFACT_DIR}" \
                    --artifact-basename "${PLAN_BASENAME}" \
                    --context-json "${context}"

                  terraform -chdir="${WORKING_DIRECTORY}" apply \
                    -input=false \
                    -no-color \
                    -lock-timeout=5m \
                    "${GITHUB_WORKSPACE}/${PLAN_ARTIFACT_DIR}/${PLAN_BASENAME}.tfplan"

            - name: Publish apply summary
              if: always()
              shell: bash
              run: |
                  {
                    echo "# Terraform Baseline Apply"
                    echo
                    echo "- Environment: \`${{ inputs.environment }}\`"
                    echo "- Commit: \`${GITHUB_SHA}\`"
                    echo "- AWS account: \`${EXPECTED_ACCOUNT_ID:-<not resolved>}\`"
                    echo "- Deployment profile: \`${DEPLOYMENT_PROFILE:-<not resolved>}\`"
                    echo "- Production retirement mode: \`${{ inputs.production_retirement_mode }}\`"
                    echo "- Status: \`${{ job.status }}\`"

                    if [[ "${{ inputs.production_retirement_mode }}" == "true" ]]; then
                      echo
                      echo "## Production retirement Stage 1"
                      echo
                      echo "This Apply only converges the Terraform-managed production retirement posture."
                      echo "It does not delete ECR images or AWS Backup recovery points."
                      echo
                      echo "The next retirement stage must inventory and explicitly approve durable-data cleanup before Terraform Destroy can proceed."
                    fi
                  } >> "${GITHUB_STEP_SUMMARY}"

    retirement-durable-data-inventory:
        name: Inventory production retirement durable data
        if: ${{ inputs.production_retirement_mode }}
        needs: [terraform-plan, terraform-apply]
        runs-on: ubuntu-latest
        timeout-minutes: 20
        environment: ${{ format('{0}-plan', inputs.environment) }}

        permissions:
            contents: read
            id-token: write

        env:
            EXPECTED_ACCOUNT_ID: ${{ needs.terraform-plan.outputs.expected_account_id }}
            AWS_REGION: ${{ needs.terraform-plan.outputs.primary_region }}
            AWS_DEFAULT_REGION: ${{ needs.terraform-plan.outputs.primary_region }}
            DEPLOYMENT_PROFILE: ${{ needs.terraform-plan.outputs.deployment_profile }}
            PLAN_ROLE_GITHUB_ARN: ${{ vars.PLAN_ROLE_GITHUB_ARN }}

        steps:
            - name: Checkout
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false

            - name: Validate retirement inventory settings
              shell: bash
              run: |
                  set -euo pipefail

                  [[ "${{ inputs.environment }}" == "prod" ]] || {
                    echo "::error::production_retirement_mode is supported only for the prod environment."
                    exit 1
                  }

                  [[ "${DEPLOYMENT_PROFILE}" == "production" ]] || {
                    echo "::error::Durable-data retirement inventory requires deployment_profile=production."
                    exit 1
                  }

                  [[ "${EXPECTED_ACCOUNT_ID}" =~ ^[0-9]{12}$ ]] || {
                    echo "::error::Expected workload account ID is invalid."
                    exit 1
                  }

                  if [[ ! "${PLAN_ROLE_GITHUB_ARN}" =~ ^arn:[^:]+:iam::([0-9]{12}):role/.+ ]]; then
                    echo "::error::PLAN_ROLE_GITHUB_ARN is not a valid IAM role ARN."
                    exit 1
                  fi

                  [[ "${BASH_REMATCH[1]}" == "${EXPECTED_ACCOUNT_ID}" ]] || {
                    echo "::error::PLAN_ROLE_GITHUB_ARN belongs to the wrong AWS account."
                    exit 1
                  }

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
              with:
                  role-to-assume: ${{ vars.PLAN_ROLE_GITHUB_ARN }}
                  aws-region: ${{ env.AWS_REGION }}
                  allowed-account-ids: ${{ env.EXPECTED_ACCOUNT_ID }}
                  role-session-name: tf-retirement-inventory-${{ github.run_id }}
                  unset-current-credentials: true

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
              with:
                  terraform_version: ${{ env.TERRAFORM_VERSION }}
                  terraform_wrapper: false

            - name: Initialize Terraform
              shell: bash
              run: |
                  set -euo pipefail

                  aws sts get-caller-identity
                  terraform -chdir="./environments/${{ inputs.environment }}" init -input=false -no-color

            - name: Inventory durable retirement data
              shell: bash
              run: |
                  set -euo pipefail

                  bash scripts/deployment/cleanup-retirement-durable-data.sh \
                    --environment "${{ inputs.environment }}" \
                    --mode plan \
                    --region "${AWS_REGION}" \
                    --expected-account-id "${EXPECTED_ACCOUNT_ID}"

    reconcile-workload-account:
        name: Reconcile workload account
        if: ${{ inputs.reconcile_workload_account }}
        needs: terraform-apply
        uses: ./.github/workflows/reconcile-workload-account.yml
        with:
            environment: ${{ inputs.environment }}
            operation: plan-and-apply
        permissions:
            id-token: write
            contents: read