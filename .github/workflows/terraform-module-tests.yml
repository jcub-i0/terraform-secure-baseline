
name: Terraform Module Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-module-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  terraform-module-tests:
    name: Terraform Module Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      AWS_EC2_METADATA_DISABLED: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false

      - name: Run Terraform test suites
        shell: bash
        run: |
          set -uo pipefail

          mkdir -p test-evidence
          failed=0

          for root in \
            modules/ecs_service \
            modules/iam \
            baseline
          do
            label="${root//\//-}"
            log="test-evidence/${label}.log"

            echo "::group::${root}"

            if ! git ls-files --error-unmatch \
              "${root}/.terraform.lock.hcl" >/dev/null 2>&1; then
              echo "::error::Missing tracked lockfile for ${root}"
              failed=1
              echo "::endgroup::"
              continue
            fi

            if terraform -chdir="${root}" init \
              -backend=false \
              -input=false \
              -lockfile=readonly \
              -no-color 2>&1 | tee "$log"; then
              echo "Initialization passed: ${root}"
            else
              echo "::error::Initialization failed: ${root}"
              failed=1
              echo "::endgroup::"
              continue
            fi

            if terraform -chdir="${root}" test \
              -no-color \
              -junit-xml="${GITHUB_WORKSPACE}/test-evidence/${label}.xml" \
              2>&1 | tee -a "$log"; then
              echo "Tests passed: ${root}"
            else
              echo "::error::Tests failed: ${root}"
              failed=1
            fi

            echo "::endgroup::"
          done

          exit "$failed"

      - name: Test IAM validator regressions
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-evidence

          python3 -m unittest \
            scripts/tests/test-ecs-execution-policy.py \
            -v 2>&1 | tee test-evidence/iam-python.log

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: terraform-module-test-evidence
          path: test-evidence/
          if-no-files-found: warn
