############################################
## GIT WORKFLOW FOR DOCUMENTATION QUALITY ##
############################################

name: Docs Validation

on:
  schedule:
    # Every Monday at 05:00 UTC
    - cron: "0 5 * * 1"
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - ".markdownlint.json"
      - ".github/workflows/docs-validation.yml"
  pull_request:
    paths:
      - "**/*.md"
      - ".markdownlint.json"
      - ".github/workflows/docs-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs_validation:
    name: Validate Markdown Docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Identify changed Markdown files
        id: changed_docs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --name-only --diff-filter=ACMR \
              "$PR_BASE"...HEAD -- '*.md' > changed-docs.txt
          elif [[ "$EVENT_NAME" == "push" ]]; then
            git diff --name-only --diff-filter=ACMR \
              "$PUSH_BEFORE" HEAD -- '*.md' > changed-docs.txt
          else
            git ls-files '*.md' > changed-docs.txt
          fi

          if [[ -s changed-docs.txt ]]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: |
            **/*.md
            !**/.terraform/**
            !**/node_modules/**

      - name: Check Links in Markdown
        if: steps.changed_docs.outputs.found == 'true'
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --format detailed
            --accept 200,206,301,302,303,307,308,429
            --retry-wait-time 5
            --max-retries 3
            --max-concurrency 16
            --timeout 20
            --include-fragments
            --files-from changed-docs.txt
          fail: true
          failIfEmpty: false

      - name: Check for Trailing Whitespace in Markdown
        run: |
          set -euo pipefail
          if grep -RIn --include='*.md' -E '[[:blank:]]+$' .; then
            echo "Trailing whitespace detected in Markdown files."
            exit 1
          fi