name: Terraform Plan

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Environment to plan"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod
          - control-plane-identity-center
          - control-plane-organizations
  pull_request:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  terraform-plan:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: dev
            github_environment: dev-plan
            working_directory: ./environments/dev
          - environment: prod
            github_environment: prod-plan
            working_directory: ./environments/prod
          - environment: staging
            github_environment: staging-plan
            working_directory: ./environments/staging
          - environment: control-plane-identity-center
            github_environment: control-plane-plan
            working_directory: ./bootstrap/control_plane/identity_center
          - environment: control-plane-organizations
            github_environment: control-plane-plan
            working_directory: ./bootstrap/control_plane/organizations

    concurrency:
      group: terraform-plan-${{ github.head_ref || github.ref_name }}-${{ matrix.environment }}
      cancel-in-progress: false

    environment: ${{ matrix.github_environment }}

    env:
      TF_VAR_cloud_name: ${{ vars.CLOUD_NAME }}
      TF_VAR_environment: ${{ vars.ENVIRONMENT }}
      TF_VAR_primary_region: ${{ vars.PRIMARY_REGION }}
      TF_VAR_identity_center_workloads: ${{ vars.IDENTITY_CENTER_WORKLOADS }}
      TF_VAR_identity_center_secops: ${{ vars.IDENTITY_CENTER_SECOPS }}
      TF_VAR_abuseipdb_api_key: ${{ secrets.ABUSEIPDB_API_KEY }}
      TF_VAR_bucket_admin_principals: ${{ vars.BUCKET_ADMIN_PRINCIPALS }}
      TF_VAR_tf_state_bucket_arn: ${{ vars.TF_STATE_BUCKET_ARN }}
      TF_VAR_tf_state_bucket_cmk_arn: ${{ vars.TF_STATE_BUCKET_CMK_ARN }}
      TF_VAR_break_glass_trusted_principal_arns: ${{ vars.BREAK_GLASS_TRUSTED_PRINCIPAL_ARNS }}
      TF_VAR_secops_emails: ${{ vars.SECOPS_EMAILS }}
      TF_VAR_isolation_allowed: ${{ vars.ISOLATION_ALLOWED }}

    steps:
      - name: Checkout
        if: github.event_name != 'workflow_dispatch' || matrix.environment == inputs.target_environment
        uses: actions/checkout@v6

      - name: Configure AWS credentials from GitHub OIDC
        if: github.event_name != 'workflow_dispatch' || matrix.environment == inputs.target_environment
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.PLAN_ROLE_GITHUB_ARN }}
          aws-region: ${{ vars.PRIMARY_REGION }}

      - name: Verify identity
        if: github.event_name != 'workflow_dispatch' || matrix.environment == inputs.target_environment
        run: aws sts get-caller-identity

      - name: Setup Terraform
        if: github.event_name != 'workflow_dispatch' || matrix.environment == inputs.target_environment
        uses: hashicorp/setup-terraform@v4

      - name: Validate Identity Center input variables
        if: >-
          (github.event_name != 'workflow_dispatch' ||
          matrix.environment == inputs.target_environment) &&
          matrix.environment == 'control-plane-identity-center'
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${TF_VAR_identity_center_workloads:-}" ]]; then
            echo "::error::IDENTITY_CENTER_WORKLOADS is not configured in the control-plane Plan environment."
            exit 1
          fi

          if [[ -z "${TF_VAR_identity_center_secops:-}" ]]; then
            echo "::error::IDENTITY_CENTER_SECOPS is not configured in the control-plane Plan environment."
            exit 1
          fi

          if ! jq -e '
            type == "object" and
            (keys | sort) == ["dev", "prod", "staging"] and
            all(.[];
              (.account_id | type == "string") and
              (.account_id | test("^[0-9]{12}$")) and
              (.primary_region | type == "string") and
              (.primary_region | length > 0) and
              ((.enable_secops_analyst // false) | type == "boolean") and
              ((.enable_secops_engineer // false) | type == "boolean") and
              (.logs_s3_readonly_policy_name | type == "string") and
              (.logs_s3_readonly_policy_name | length > 0) and
              (.logs_cmk_decrypt_policy_name | type == "string") and
              (.logs_cmk_decrypt_policy_name | length > 0)
            )
          ' <<< "${TF_VAR_identity_center_workloads}" >/dev/null; then
            echo "::error::IDENTITY_CENTER_WORKLOADS is not valid JSON matching the Terraform workload map schema."
            exit 1
          fi

          if ! jq -e '
            type == "object" and
            (.account_id | type == "string") and
            (.account_id | test("^[0-9]{12}$")) and
            ((.enable_secops_analyst // false) | type == "boolean") and
            ((.enable_secops_engineer // false) | type == "boolean") and
            ((.logs_s3_readonly_policy_name == null) or
              (.logs_s3_readonly_policy_name | type == "string")) and
            ((.logs_cmk_decrypt_policy_name == null) or
              (.logs_cmk_decrypt_policy_name | type == "string"))
          ' <<< "${TF_VAR_identity_center_secops}" >/dev/null; then
            echo "::error::IDENTITY_CENTER_SECOPS is not valid JSON matching the Terraform security-operations object schema."
            exit 1
          fi

      - name: Validate workload isolation setting
        if: >-
          (github.event_name != 'workflow_dispatch' ||
          matrix.environment == inputs.target_environment) &&
          (matrix.environment == 'dev' ||
          matrix.environment == 'staging' ||
          matrix.environment == 'prod')
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${TF_VAR_isolation_allowed:-}" ]]; then
            echo "::error::ISOLATION_ALLOWED is not configured for this workload Plan environment."
            exit 1
          fi

          if [[ ! "${TF_VAR_isolation_allowed}" =~ ^(true|false)$ ]]; then
            echo "::error::ISOLATION_ALLOWED must be exactly true or false."
            exit 1
          fi

      - name: Terraform Init
        if: github.event_name != 'workflow_dispatch' || matrix.environment == inputs.target_environment
        working-directory: ${{ matrix.working_directory }}
        run: terraform init

      - name: Terraform Validate
        if: github.event_name != 'workflow_dispatch' || matrix.environment == inputs.target_environment
        working-directory: ${{ matrix.working_directory }}
        run: terraform validate

      - name: Terraform Plan
        if: github.event_name != 'workflow_dispatch' || matrix.environment == inputs.target_environment
        working-directory: ${{ matrix.working_directory }}
        run: terraform plan -no-color -lock-timeout=5m